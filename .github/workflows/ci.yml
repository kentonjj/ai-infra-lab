name: ci
on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 安装 uv
        uses: astral-sh/setup-uv@v3
        with:
          python-version: "3.11"
      - name: 同步依赖
        run: uv sync
      - name: 静态检查
        run: uv run ruff check .
      - name: 格式检查
        run: uv run ruff format --check .
      - name: 单元测试
        run: uv run pytest -q
